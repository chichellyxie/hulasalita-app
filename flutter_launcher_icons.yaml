# HulaSalita launcher icon. Generate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true            # replaces the default ic_launcher (Flutter logo)
  ios: false               # HulaSalita is Android only
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

  # Android 8+ adaptive icon: navy background + HULA tiles
  adaptive_icon_background: "#161675"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

  # Android 13+ themed icons (follows the phone's wallpaper colors)
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
